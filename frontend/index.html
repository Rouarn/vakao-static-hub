<!doctype html>
<html lang="zh_CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>静态资源管理</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* ========== Loading 容器 ========== */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ========== 背景粒子 ========== */
      .particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        animation: floatUp 7s ease-in-out infinite;
      }
      .particle:nth-child(1) {
        width: 5px;
        height: 5px;
        top: 18%;
        left: 12%;
        animation-duration: 7.2s;
        animation-delay: 0s;
      }
      .particle:nth-child(2) {
        width: 7px;
        height: 7px;
        top: 28%;
        right: 14%;
        animation-duration: 8.5s;
        animation-delay: 1.2s;
      }
      .particle:nth-child(3) {
        width: 4px;
        height: 4px;
        bottom: 22%;
        left: 10%;
        animation-duration: 6.4s;
        animation-delay: 2.4s;
      }
      .particle:nth-child(4) {
        width: 6px;
        height: 6px;
        bottom: 28%;
        right: 18%;
        animation-duration: 9s;
        animation-delay: 0.8s;
      }
      .particle:nth-child(5) {
        width: 4px;
        height: 4px;
        top: 55%;
        left: 78%;
        animation-duration: 7.8s;
        animation-delay: 1.8s;
      }
      .particle:nth-child(6) {
        width: 5px;
        height: 5px;
        top: 42%;
        left: 6%;
        animation-duration: 6.8s;
        animation-delay: 3.2s;
      }

      @keyframes floatUp {
        0%,
        100% {
          transform: translateY(0) translateX(0);
          opacity: 0.25;
        }
        25% {
          transform: translateY(-18px) translateX(8px);
          opacity: 0.6;
        }
        50% {
          transform: translateY(-36px) translateX(-4px);
          opacity: 0.3;
        }
        75% {
          transform: translateY(-18px) translateX(-12px);
          opacity: 0.55;
        }
      }

      /* ========== 加载内容 ========== */
      .loading-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        animation: contentFadeIn 0.6s ease-out both;
      }
      @keyframes contentFadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ========== Spinner 旋转加载环 ========== */
      .spinner-wrapper {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 底环 */
      .spinner-wrapper::before {
        content: '';
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 3px solid;
        border-color: inherit;
        opacity: 0.12;
      }
      /* 旋转弧线 */
      .spinner-wrapper::after {
        content: '';
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: currentColor;
        border-right-color: currentColor;
        border-bottom-color: transparent;
        border-left-color: transparent;
        animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 中心图标 */
      .spinner-icon {
        position: relative;
        z-index: 1;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: iconPulse 2.2s ease-in-out infinite;
      }
      .spinner-icon svg {
        width: 100%;
        height: 100%;
      }
      @keyframes iconPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.12);
        }
      }

      /* ========== 文字 ========== */
      .loading-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .app-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 6px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', sans-serif;
      }
      .app-subtitle {
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 3px;
        opacity: 0.6;
      }

      /* ========== 进度条 ========== */
      .progress-container {
        width: 180px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        border-radius: 3px;
        width: 0%;
        animation: loadProgress 2s ease-out forwards;
      }
      @keyframes loadProgress {
        0% {
          width: 0%;
        }
        12% {
          width: 8%;
        }
        30% {
          width: 35%;
        }
        55% {
          width: 65%;
        }
        78% {
          width: 85%;
        }
        100% {
          width: 96%;
        }
      }

      /* ========== App 容器 ========== */
      #app {
        display: none;
      }

      /* ========================================
         亮色主题
         ======================================== */
      .loading-light {
        background: linear-gradient(
          160deg,
          #f4f6f9 0%,
          #eceff4 40%,
          #e2e6ed 100%
        );
      }
      .loading-light .particle {
        background: rgba(24, 160, 88, 0.22);
      }
      .loading-light .spinner-wrapper {
        color: #18a058;
      }
      .loading-light .spinner-wrapper::before {
        border-color: #18a058;
      }
      .loading-light .spinner-icon svg {
        fill: #18a058;
      }
      .loading-light .app-title {
        color: #1a1a2e;
      }
      .loading-light .app-subtitle {
        color: #4a5568;
      }
      .loading-light .progress-container {
        background: rgba(0, 0, 0, 0.08);
      }
      .loading-light .progress-bar {
        background: linear-gradient(90deg, #18a058, #36ad6a, #63e2b7);
      }

      /* ========================================
         暗色主题
         ======================================== */
      .loading-dark {
        background: linear-gradient(
          160deg,
          #101014 0%,
          #18181c 40%,
          #1e1e24 100%
        );
      }
      .loading-dark .particle {
        background: rgba(99, 226, 183, 0.25);
      }
      .loading-dark .spinner-wrapper {
        color: #63e2b7;
      }
      .loading-dark .spinner-wrapper::before {
        border-color: #63e2b7;
      }
      .loading-dark .spinner-icon svg {
        fill: rgba(255, 255, 255, 0.9);
      }
      .loading-dark .app-title {
        color: rgba(255, 255, 255, 0.88);
      }
      .loading-dark .app-subtitle {
        color: rgba(255, 255, 255, 0.5);
      }
      .loading-dark .progress-container {
        background: rgba(255, 255, 255, 0.08);
      }
      .loading-dark .progress-bar {
        background: linear-gradient(90deg, #36ad6a, #63e2b7, #18a058);
      }
    </style>
  </head>
  <body
    class="font-sans bg-container text-base h-screen overflow-hidden transition-colors duration-300"
  >
    <div id="loading">
      <!-- 背景粒子 -->
      <div class="particles">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
      </div>

      <div class="loading-content">
        <!-- 旋转加载环 + 云朵图标 -->
        <div class="spinner-wrapper">
          <div class="spinner-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"
              />
            </svg>
          </div>
        </div>

        <!-- 标题 -->
        <div class="loading-text">
          <div class="app-title">STATIC HUB</div>
          <div class="app-subtitle">静态资源管理系统</div>
        </div>

        <!-- 进度条 -->
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
    <script>
      function getTheme() {
        const vueuseColorScheme = localStorage.getItem('vueuse-color-scheme');
        if (vueuseColorScheme === 'light') {
          return 'light';
        }
        if (vueuseColorScheme === 'auto' || !vueuseColorScheme) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            return 'dark';
          }
        }
        return 'light';
      }
      const loading = document.getElementById('loading');
      const theme = getTheme();
      loading.classList.add(`loading-${theme}`);
      document.addEventListener('DOMContentLoaded', () => {
        const app = document.getElementById('app');
        const hideLoading = () => {
          if (loading && app) {
            loading.style.opacity = '0';
            setTimeout(() => {
              loading.style.display = 'none';
              app.style.display = 'block';
            }, 500);
          }
        };
        setTimeout(hideLoading, 2000);
      });
    </script>
  </body>
</html>
