<svg width="300" height="155" viewBox="0 0 300 155" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18a058;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c7a43;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="155" rx="16" fill="url(#primaryGrad)" />
  
  <!-- Abstract Decorative Elements -->
  <circle cx="280" cy="20" r="50" fill="white" fill-opacity="0.08" />
  <circle cx="20" cy="135" r="40" fill="white" fill-opacity="0.05" />
  <path d="M0 155 L100 155 L0 55 Z" fill="white" fill-opacity="0.03" />

  <!-- Logo (Cloud) -->
  <g transform="translate(125, 25)" filter="url(#softShadow)">
    <path d="M25 7C17.8 7 11.6 11.8 9.8 18.4 3.9 19.6 0 24.2 0 29.7 0 35.8 5 40.8 11.1 40.8H36.1C42.2 40.8 47.2 35.8 47.2 29.7 47.2 24.2 43.3 19.6 37.4 18.4 35.6 11.8 29.4 7 22.2 7" fill="white" transform="scale(1.1)" />
    <path d="M22 25 L27 30 L36 21" stroke="#18a058" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Title Text -->
  <text x="150" y="105" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="white" text-anchor="middle" letter-spacing="0.5">StaticHub</text>
  
  <!-- Subtitle Text -->
  <text x="150" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white" fill-opacity="0.85" text-anchor="middle" letter-spacing="1">VAKAO STATIC ASSET HUB</text>
  
  <!-- Decorative Bottom Line -->
  <rect x="135" y="140" width="30" height="2" rx="1" fill="white" fill-opacity="0.5" />
</svg>
